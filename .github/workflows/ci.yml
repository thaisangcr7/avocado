name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: ruff check
        working-directory: backend
        run: ruff check .
      - name: ruff format --check
        working-directory: backend
        run: ruff format --check .

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: avocado
          POSTGRES_PASSWORD: avocado
          POSTGRES_DB: avocado_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avocado"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://avocado:avocado@localhost:5432/avocado_test
      DATABASE_URL: postgresql+asyncpg://avocado:avocado@localhost:5432/avocado_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt

      # Built here because the sandbox security tests start real containers.
      # Without it they skip, and the guarantees they protect go unverified.
      - name: Build the analysis sandbox image
        run: docker build -t avocado-sandbox:latest ./sandbox

      - name: Migrations apply cleanly and are reversible
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Models and migrations have not drifted
        working-directory: backend
        run: alembic check

      - name: Tests
        working-directory: backend
        # -n auto splits the suite across the runner's cores. It waits on
        # Postgres and Docker far more than it computes, so wall time falls
        # with workers. Each worker gets its own database (tests/conftest.py).
        run: pytest -q -n auto --cov=app --cov-report=term --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t avocado-api:${{ github.sha }} ./backend
      - name: Build the analysis sandbox image
        run: docker build -t avocado-sandbox:${{ github.sha }} ./sandbox
      - name: Build the sandbox runner image
        run: |
          docker build -t avocado-sandbox-runner:${{ github.sha }} \
            -f sandbox/Dockerfile.service .

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
