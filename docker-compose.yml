# Local stack. The same API image runs in the cloud — only the environment
# differs, which is the whole point of keeping every setting in env vars.
name: avocado

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: avocado
      POSTGRES_PASSWORD: avocado
      POSTGRES_DB: avocado
    ports:
      # Published on 5434 to stay clear of any other Postgres already running
      # on this machine. Inside the compose network the port is still 5432.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avocado -d avocado"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://avocado:avocado@db:5432/avocado
      REDIS_URL: redis://redis:6379/0
      # Analysis is delegated to the sandbox runner, so this container never
      # holds the Docker socket — and so never has root on the host.
      SANDBOX_BACKEND: http
      SANDBOX_URL: http://sandbox:8080
      SANDBOX_AUTH_TOKEN: ${SANDBOX_AUTH_TOKEN:?set SANDBOX_AUTH_TOKEN in .env}
      UVICORN_RELOAD: "true"
      # Off by default; set true to bootstrap demo data automatically once the
      # API is live. Safe on restarts: seeding is skipped when workspaces exist.
      AUTO_SEED_DEMO: ${AUTO_SEED_DEMO:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox:
        condition: service_started
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head && sh scripts/start_api.sh"

  sandbox:
    # The only container that holds the Docker socket. It runs analysis code and
    # nothing else: no database, no model access, no tenant data beyond the rows
    # it is handed for a single run. Compromising the API therefore no longer
    # means owning the host.
    # Named explicitly: compose would otherwise derive "avocado-sandbox" from
    # the project and service name, which is the analysis image's tag —
    # building this service would silently overwrite it, and every analysis
    # would then start this API instead of the runner.
    image: avocado-sandbox-runner:latest
    build:
      context: .
      dockerfile: sandbox/Dockerfile.service
    environment:
      SANDBOX_IMAGE: avocado-sandbox:latest
      SANDBOX_AUTH_TOKEN: ${SANDBOX_AUTH_TOKEN:?set SANDBOX_AUTH_TOKEN in .env}
      # Shared with the host at the same path, so a bind mount created here
      # resolves to the same directory when the host daemon reads it.
      SANDBOX_WORK_ROOT: /var/tmp/avocado-sandbox
      SANDBOX_TIMEOUT_SECONDS: "30"
      SANDBOX_MEMORY_MB: "512"
      SANDBOX_CPUS: "1.0"
    volumes:
      # Sibling containers on the host daemon. Scoped to this one service
      # rather than granted to the API.
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/tmp/avocado-sandbox:/var/tmp/avocado-sandbox
    # Not published: reachable only from the compose network.
    expose:
      - "8080"

  worker:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://avocado:avocado@db:5432/avocado
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # The worker shares the API image, which healthchecks an HTTP endpoint the
    # worker does not serve — so the inherited check always fails and reports a
    # perfectly healthy worker as unhealthy.
    healthcheck:
      disable: true
    command: arq app.worker.main.WorkerSettings

  web:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  redisdata:
