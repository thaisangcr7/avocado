server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: unknown paths are the app's to resolve, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy serves stale asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Runtime config is rewritten by the container entrypoint and should never
    # be cached across deployments.
    location = /env.js {
        add_header Cache-Control "no-cache";
    }
}
